<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Film Diary</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500&family=Geist+Mono:wght@300;400&display=swap" rel="stylesheet" />

<style>
  :root{
    --paper:#f4f1ea;
    --paper-2:#ebe7dd;
    --ink:#2a2926;
    --ink-soft:#7a766d;
    --ink-faint:#b8b3a7;
    --accent:oklch(58% 0.09 50);
    --sans:"Geist", ui-sans-serif, system-ui, sans-serif;
    --serif:"Instrument Serif", "Newsreader", Georgia, serif;
    --mono:"Geist Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}

  #root{position:relative;width:100%;height:100%;z-index:1}
</style>
</head>
<body style="background-color: rgb(250, 243, 240); font-family: Geist">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="image-slot.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script>
  // Tweakable defaults — the EDITMODE block is rewritten by the host
  // whenever the user moves a slider, so changes survive reload.
  window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "gap": 0,
    "photoSize": 1,
    "neighborScale": 0.2,
    "neighborFade": 0.5
  }/*EDITMODE-END*/;
</script>
<script type="text/babel" src="diary.jsx"></script>
</body>
</html>
